services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synccrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: synccrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synccrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://synccrm:${POSTGRES_PASSWORD:-change-me}@db:5432/synccrm?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
